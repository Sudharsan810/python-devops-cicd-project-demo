name: publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: 
        description: 'release tag to publish'
        required: true
        type: string


jobs:
    Publish-testpypi:
        runs-on: ubuntu-latest
        environment: dev
        permissions:
            id-token: write
            contents: read
        steps:
            - name: download wheel artifact
              uses:  robinraju/release-downloader@v1.12
              with:
                repository: ${{ github.repository }}
                tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
                fileName: '*.whl'
                out-file-path: dist/
            - name: download tarball artifact
              uses:  robinraju/release-downloader@v1.12
              with:
                repository: ${{ github.repository }}
                tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
                fileName: '*.tar.gz'
                out-file-path: dist/
            - name: publish to test PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                repository-url: https://test.pypi.org/legacy/
                skip-existing: true
                verbose: true
            
    Publish-pypi:
        needs: Publish-testpypi
        runs-on: ubuntu-latest
        environment: prod
        permissions:
            id-token: write
            contents: read
        steps:
            - name: download wheel artifact
              uses:  robinraju/release-downloader@v1.12
              with:
                repository: ${{ github.repository }}
                tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
                fileName: '*.whl'
                out-file-path: dist/
            - name: download tarball artifact
              uses:  robinraju/release-downloader@v1.12
              with:
                repository: ${{ github.repository }}
                tag: ${{ github.event.release.tag_name || github.event.inputs.tag }}
                fileName: '*.tar.gz'
                out-file-path: dist/
            - name: publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                verbose: true

