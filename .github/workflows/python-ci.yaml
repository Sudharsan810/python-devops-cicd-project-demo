name: CI/CD for simple_http_checker

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  lint_static_checks:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: display python version
        run: |
          python --version
          which python
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Linting and formatting checks
        run: |
          ruff check .
          black --check .
      - name: Type checks and security checks
        run: |
          mypy ./src
          bandit -c pyproject.toml -r . 

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9','3.10','3.11','3.12','3.13','3.14']
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: test
        run: |
          pytest
  release:
    runs-on: ubuntu-latest
    needs:
      - lint_static_checks
      - tests
    steps:
      - name: release task
        run: |
          echo "Release Task"


  